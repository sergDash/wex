<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title> <script>try{const t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.classList.toggle('dark',t==='dark')}catch(e){}</script>
    <script>window.Quas = { AutoDarkMode: false };</script>
    <script src="https://cdn.jsdelivr.net/gh/wemmbley/quas@master/Source/Quas.js"></script>
    <script src="./wex-draggable.js"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-[13px] text-slate-700 antialiased sm:p-8 dark:bg-slate-950 dark:text-slate-300">
<div class="mx-auto max-w-5xl">
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-semibold tracking-tight">Draggable</h1>
        <button id="theme" class="rounded border border-slate-300 bg-white px-3 py-1 text-xs dark:border-slate-600 dark:bg-slate-900">light / dark</button>
    </div>

    <h2 class="mb-2 text-lg font-medium">list: колонки (канбан)</h2>
    <div id="list" class="grid grid-cols-3 gap-2">
        <div class="flex min-h-[140px] flex-col gap-1 rounded bg-slate-200 p-2 dark:bg-slate-800" data-container="todo"></div>
        <div class="flex min-h-[140px] flex-col gap-1 rounded bg-slate-200 p-2 dark:bg-slate-800" data-container="doing"></div>
        <div class="flex min-h-[140px] flex-col gap-1 rounded bg-slate-200 p-2 dark:bg-slate-800" data-container="done"></div>
    </div>
    <pre id="listLog" class="mt-2 h-10 overflow-auto text-[11px] text-slate-500"></pre>

    <h2 class="mb-2 mt-8 text-lg font-medium">flow: перестановка в сетке</h2>
    <div id="flow" class="grid grid-cols-4 gap-2"></div>
    <pre id="flowLog" class="mt-2 h-10 overflow-auto text-[11px] text-slate-500"></pre>

    <h2 class="mb-2 mt-8 text-lg font-medium">cells: стикеры в любую свободную ячейку</h2>
    <div id="cells" style="display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,90px);gap:8px" class="rounded bg-slate-200 p-2 dark:bg-slate-800"></div>
    <pre id="cellsLog" class="mt-2 h-10 overflow-auto text-[11px] text-slate-500"></pre>
</div>

<script>
    document.getElementById('theme').onclick = () => {
        const dark = document.documentElement.classList.toggle('dark')
        try { localStorage.setItem('theme', dark ? 'dark' : 'light') } catch (e) {}
    }
    const $ = s => document.querySelector(s)
    const log = (id, e) => { $(id).textContent = JSON.stringify(e, (k, v) => (k === 'el' || k === 'event' || k === 'container' ? undefined : v)) }
    const CARD = 'rounded border border-slate-200 bg-white p-3 text-xs shadow-sm dark:border-slate-700 dark:bg-slate-900'

    // демо сам переставляет DOM по событию drop; в Wex это делает перерисовка по изменению state
    function moveBy(root, e) {
        const target = root.querySelector('[data-container="' + e.to + '"]') || root
        const el = root.querySelector('[data-id="' + e.id + '"]')
        const before = e.before && root.querySelector('[data-id="' + e.before + '"]')
        target.insertBefore(el, before)
    }

    // ---- list
    const cols = { todo: ['Fix login', 'Write docs', 'Refactor router'], doing: ['Datepicker'], done: ['DataTable'] }
    let n = 0
    Object.keys(cols).forEach(k => cols[k].forEach(t => {
        const d = document.createElement('div')
        d.className = CARD; d.dataset.id = 'c' + (++n); d.textContent = t
        document.querySelector('#list [data-container="' + k + '"]').appendChild(d)
    }))
    createDraggable({ root: () => $('#list'), mode: 'list', containers: '[data-container]', on: { drop: e => { if (e.moved) moveBy($('#list'), e); log('#listLog', e) }, cancel: e => log('#listLog', e) } })

    // ---- flow
    for (let i = 1; i <= 8; i++) {
        const d = document.createElement('div')
        d.className = CARD + ' flex h-20 items-center justify-center text-lg'; d.dataset.id = 'f' + i; d.textContent = i
        $('#flow').appendChild(d)
    }
    function swapEls(root, e) {
        const a = root.querySelector('[data-id="' + e.id + '"]')
        const b = root.querySelector('[data-id="' + e.with + '"]')
        const m = document.createComment('')
        a.before(m); b.before(a); m.replaceWith(b)
    }
    createDraggable({ root: () => $('#flow'), mode: 'flow', swap: true, on: { drop: e => { if (e.moved) swapEls($('#flow'), e); log('#flowLog', e) } } })

    // ---- cells
    const stickers = [[0, 0, 1, 1, 'Купить хлеб'], [1, 0, 2, 1, 'Созвон в 15:00 (2 ячейки)'], [3, 1, 1, 2, 'Идея: канбан'], [0, 2, 1, 1, 'Оплатить хостинг']]
    stickers.forEach(([x, y, w, h, t], i) => {
        const d = document.createElement('div')
        d.className = 'rounded bg-yellow-200 p-2 text-xs text-slate-800 shadow dark:bg-yellow-300'
        d.dataset.id = 's' + i; d.textContent = t
        Object.assign(d.dataset, { x, y, w, h })
        d.style.gridColumn = (x + 1) + ' / span ' + w; d.style.gridRow = (y + 1) + ' / span ' + h
        $('#cells').appendChild(d)
    })
    createDraggable({
        root: () => $('#cells'), mode: 'cells',
        on: {
            drop: e => { if (e.moved) { const el = e.el; el.dataset.x = e.to.x; el.dataset.y = e.to.y; el.style.gridColumn = (e.to.x + 1) + ' / span ' + e.w; el.style.gridRow = (e.to.y + 1) + ' / span ' + e.h } log('#cellsLog', e) },
            cancel: e => log('#cellsLog', e)
        }
    })
</script>
</body>
</html>
