<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monster Menu demo</title>
    <style>
        /* семантические цвета Quas (shadcn neutral) */
        :root{--color-base-100:#fff;--color-base-200:#f5f5f5;--color-base-300:#e5e5e5;--color-base-content:#0a0a0a;
            --color-primary:#171717;--color-primary-content:#fafafa;--color-accent:#f5f5f5;--color-accent-content:#171717}
        .dark{--color-base-100:#0a0a0a;--color-base-200:#171717;--color-base-300:#262626;--color-base-content:#fafafa;
            --color-primary:#fafafa;--color-primary-content:#171717;--color-accent:#262626;--color-accent-content:#fafafa}
    </style>
    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="../../../dist/wex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/wemmbley/quas@master/Source/Quas.js"></script>
    <script src="../../../dist/plugins/wex-monster-menu.min.js"></script>
</head>
<body>
<template id="app" attrs="{ class: 'min-h-screen bg-base-100 text-base-content' }">
    <header class="border-b border-base-300">
        <div class="container mx-auto flex h-14 items-center gap-4 px-4">
            <a href="/" class="font-semibold">Logo</a>
            <Menu :items="menuItems"></Menu>
            <button type="button" class="ml-auto rounded-md border border-base-300 px-3 py-1 lg:hidden" w-on="click:toggleMenu">Menu</button>
        </div>
    </header>
    <main class="container mx-auto p-4">Контент страницы</main>
</template>

<script>
    const { createMenu, component } = window.jqvm;

    // кастомный блок для monster-панели: контракт — state { block, ui }
    component('MenuQuote', $('<template><blockquote class="{{ ui.blockLinkDesc }}">{{ block.text }}</blockquote></template>')
        .state(() => ({ block: {}, ui: {} })));

    const menu = createMenu({
        trigger: 'hover',
        breakpoint: 'lg',
        blocks: { quote: 'MenuQuote' },
        drawer: { side: 'left', width: '50vw' }
        // ui: { link: '...', panel: '...' }   — переопределения карты классов
    });

    $('#app')
        .state({ menuItems: [] })
        .plugin(menu)
        .method('toggleMenu', () => { $menu.toggle(); })
        .on('$mount', state => { $wire.get('menu.json').to(state.menuItems); })   // нужен http-сервер, не file://
        .mount();
</script>
</body>
</html>
