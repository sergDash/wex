<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <template id="app">

        <!-- 1. Одиночная картинка. Лайтбокс по умолчанию,
        alt ставится автоматически -->
        <Image :url="" :full="" :alt=""></Image>
        <Image :url="" :lightbox="false"></Image>

        <!-- 2. Поведения тегами: w-zoom-lightbox = клик,
        w-zoom-lense = лупа при наведении -->
        <Image :url="" w-zoom-lense></Image>
        <Image :url="" w-zoom-lense w-lightbox-lense></Image>

        <!-- 3. Директивами на обычном <img>; источник big: w-full,
        data-full или родительский <a href> -->
        <img src="" alt="" w-zoom-lightbox w-zoom-lense>
        <a href="big.jpg"><img src="thumb.jpg" w-zoom-lightbox></a>

        <!-- 4. Простая карусель -->
        <Carousel
                :autoslide="true"
                :interval="3000"
                :loop="true"
                :hover-pause="true"
                :navigate-arrows="true"
                :navigate-dots="true"
        >
            <Image :url=""></Image>
            <Image :url=""></Image>
            <Image :url=""></Image>
        </Carousel>

        <!-- 5. Полностью кастомная навигация: служебные дети
        вырезаются из слайдов -->
        <Carousel :autoslide="true">
            <div w-navigate-left>‹</div>
            <Image :url=""></Image>
            <Image :url=""></Image>
            <div w-navigate-right>›</div>
            <div w-navigate-dots class="flex gap-2"></div>
            <button w-goto="2">Перейти к третьему</button>
        </Carousel>

        <!-- 6. Адаптив через Quas: классы призрачного дива
        копируются на слайды -->
        <Carousel :gap="16" :navigate-arrows="true">
            <div w-carousel-adaptive class="w-full sm:w-1/2 md:w-1/4"></div>
            <div class="card">Товар 1</div>
            <div class="card">Товар 2</div>
            <div class="card">Товар 3</div>
            <div class="card">Товар 4</div>
        </Carousel>

        <!-- 7. Адаптив без Quas: именованные пороги -->
        <Carousel
                :breakpoints="{ sm: 724, md: 920 }"
                :per-view="{ base: 1, sm: 2, md: 4 }"
                :gap="16"
        >
            ...
        </Carousel>

        <!-- 8. Галерея товара: вертикальные превью слева, большая
        картинка справа -->
        <div class="flex gap-4">
            <Carousel :thumbs-of="product" direction="vertical" :per-view="5" :gap="8"
                      :navigate-arrows="true" class="w-24"></Carousel>

            <Carousel name="product" :navigate-arrows="true" :navigate-dots="false" class="flex-1">
                <Image :url="" :thumb="" w-zoom-lense></Image>
                <Image :url="" :thumb=""></Image>
                <Image :url="" :thumb=""></Image>
            </Carousel>
        </div>

        <!-- 9. Превью снизу, та же схема горизонтально -->
        <Carousel name="p2"> ... </Carousel>
        <Carousel :thumbs-of="p2" :per-view="{ base: 4, md: 6 }" :gap="8"></Carousel>

    </template>
</body>
<footer>
    <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
    <script src="../../dist/wex.js"></script>
    <script>
        $('#app')
            .state({ posts: {} })
            .mount()
    </script>
</footer>
</html>
