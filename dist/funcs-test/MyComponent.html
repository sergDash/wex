<template>
    <slot></slot>
    <p>Встроенный стейт: {{ myState }}</p>
    <p>Статический пропс: {{ varStatic }}</p>
    <p>Динамический пропс: {{ varDynamic }}</p>
    <br>
    <div w-for="product,index in wireState traceby product.id">
        {{ post.name }}<br>
        {{ post.description }}<br>
    </div>
</template>

<script type="module">
    export default ($template) => $template
        .state({
            myState: 'Кнопка',
            varStatic: '',
            varDynamic: '',
            wireState: [],
        })
        .on('$mount', (state) => {
            $wire.get('Data.json').to(state.wireState);
        })
</script>
